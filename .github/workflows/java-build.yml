name: Java Build Check

# Run on every push to main and on every pull request that targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the code, so it needs no write access.
permissions:
  contents: read

# When a new commit arrives on the same pull request, stop the older run.
concurrency:
  group: java-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile all Java files
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show the Java version
        run: javac -version

      - name: Compile every Java file in the project
        run: |
          # Find every .java file in the src folder, at any depth below it.
          find src -name "*.java" > java-files.txt

          # Stop with a clear message if the src folder has no Java files.
          if [ ! -s java-files.txt ]; then
            echo "::error::No Java files were found in the src folder."
            exit 1
          fi

          echo "Compiling these files:"
          cat java-files.txt

          # Put the compiled classes in a temporary folder, so the repository stays clean.
          mkdir -p "$RUNNER_TEMP/classes"
          javac -d "$RUNNER_TEMP/classes" @java-files.txt

          echo "All Java files compiled without errors."
