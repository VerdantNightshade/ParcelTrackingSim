name: Java Build and Test

# Run on every push to main and on every pull request that targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the code, so it needs no write access.
permissions:
  contents: read

# When a new commit arrives on the same pull request, stop the older run.
concurrency:
  group: java-build-${{ github.ref }}
  cancel-in-progress: true

# The steps below are the same steps that "bash test/run-tests.sh" runs on your
# own computer. Run that command locally before you push.
jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show the Java version
        run: javac -version

      - name: Step 1 - Build test
        run: bash test/build.sh

      - name: Step 2 - Compile the tests
        run: bash test/compile-tests.sh

      - name: Step 3 - Run the unit tests
        run: bash test/unit-tests.sh
